name: covector status
on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  covector:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: covector status
        uses: jbolda/covector/packages/action@covector-v0
        id: covector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: status
          token: ${{ secrets.GITHUB_TOKEN }}
          comment: true
