name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.installer-architecture }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - target: i686-pc-windows-msvc
            installer-architecture: x86
          - target: x86_64-pc-windows-msvc
            installer-architecture: x64
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo test --locked --workspace --target ${{ matrix.target }}

      - name: Install Inno Setup
        uses: MinoruSekine/setup-scoop@v5.0.1
        with:
          buckets: extras
          apps: inno-setup

      - name: Run utilities inside a native installer
        run: cargo test --locked -p inno-integration-tests --target ${{ matrix.target }} -- --ignored --nocapture
